name: 功能建议
description: 描述你要完成的制作任务和当前缺口
body:
  - type: textarea
    id: task
    attributes:
      label: 你想完成什么？
      description: 说明实际内容、输入素材和预期交付物。
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: 当前流程卡在哪里？
      description: 如有参考画面或可接受的替代流程，请一并提供。
    validations:
      required: true
